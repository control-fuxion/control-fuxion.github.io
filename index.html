      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071f18; }
      .loader { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px; color: #effff7; background: radial-gradient(circle at 70% 10%, rgba(99, 236, 164, .22), transparent 34%), linear-gradient(145deg, #061a14, #0b3728); transition: opacity .35s ease, visibility .35s ease; }

      p { margin: 0; color: #c6e5d6; font-size: 14px; line-height: 1.55; }
      .bar { height: 4px; margin-top: 24px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.12); }
      .bar::after { display: block; width: 42%; height: 100%; border-radius: inherit; background: #caff54; animation: move 1.1s ease-in-out infinite alternate; content: ""; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #f4f8f5; }
